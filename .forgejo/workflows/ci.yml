---
# CI for the cookie-py template repo itself, on Forgejo Actions (the upstream
# where development happens). Mirrors the GitHub test-template.yml gate — copier
# integration tests across supported Pythons + prek — minus the Docker build job
# (the homelab runner is privileged: false, so it can't run `docker build`).
#
# `runs-on: ubuntu-latest` must match a label the act_runner registers; the
# runner provides git + node + python/pip and uv installs at runtime (no baked
# CI image), matching the template's own .forgejo convention.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # A generated project installs the newest release of each dependency, so an
  # upstream release can break it while nothing changes here. The daily run
  # shows that before someone generates a project.
  schedule:
    - cron: "0 5 * * *"

jobs:
  test-template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # PEP 668: the runner's Python is externally managed.
        run: pip install --no-cache-dir --break-system-packages uv
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install copier and prek
        run: |
          uv tool install copier
          uv tool install prek
      - name: Install dependencies
        run: uv sync --dev
      - name: Run integration tests
        run: uv run pytest tests/test_copier_integration.py -v

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pip install --no-cache-dir --break-system-packages uv
      - name: Install Python 3.14
        # Without a version, uv downloads the newest CPython it knows. A new
        # release then breaks the sync until every locked dependency has a
        # wheel for it.
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --dev
      - uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: prek (commit stage)
        run: uv run prek run --all-files --show-diff-on-failure --hook-stage pre-commit

  # Tags each green merge to main that changes what copier reads, with the next
  # patch version. A new tag makes the copier-update job of every generated
  # project open a pull request, so a merge that leaves the template alone gets
  # no tag. Minor and major versions are tagged by hand; copier takes the
  # highest tag, and the next patch follows it.
  release:
    needs: [test-template, prek]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the next patch version
        run: |
          latest="$(git tag --merged HEAD --list 'v*' --sort=-v:refname | head -n 1)"
          if git diff --quiet "$latest" HEAD -- template copier.yml tasks licenses; then
            echo "Nothing that copier reads changed since $latest, so no tag."
            exit 0
          fi
          version="${latest#v}"
          next="v${version%.*}.$((${version##*.} + 1))"
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.localhost"
          git tag -a "$next" -m "$next"
          git push origin "$next"
