_min_copier_version: "9.1.0"
_subdirectory: template
_templates_suffix: .jinja

# Copier tasks (replacing cookiecutter hooks). List form (not shell) so
# arguments with spaces / quotes (e.g. author names) pass through safely.
_tasks:
  - command:
      - python
      - "{{ _copier_conf.src_path }}/tasks/post_generate.py"
      - "--ci-provider"
      - "{{ ci_provider }}"
      - "--license"
      - "{{ license }}"
      - "--author"
      - "{{ author }}"
      - "--template-src"
      - "{{ _copier_conf.src_path }}"
      - "{% if not enable_github_copilot %}--disable-copilot{% endif %}"
      - "--repo-visibility"
      - "{{ repo_visibility }}"

# --- Project metadata ---

project_name:
  type: str
  help: "What is your project's name?"
  default: "{{ _copier_conf.dst_path.name }}"

directory_name:
  type: str
  help: "Directory name for the project"
  default: "{{ project_name | lower | replace(' ', '-') }}"

project_type:
  type: str
  help: "What kind of project is this?"
  default: "library"
  choices:
    "Library": "library"
    "CLI application (Click)": "cli"
    "Documentation only (MkDocs)": "docs"

pkg_name:
  type: str
  help: "Python package name"
  default: "{{ directory_name | replace('-', '_') }}"
  when: "{{ project_type != 'docs' }}"

description:
  type: str
  help: "Short project description"
  default: "{{ project_name }} is awesome"

author:
  type: str
  help: "Author name and email"
  default: "Felipe 'Bidu' Rodrigues <felipe@felipevr.com>"

version:
  type: str
  help: "Initial version"
  default: "0.1.0"

license:
  type: str
  help: "License (SPDX identifier; controls both pyproject metadata and the generated LICENSE file)"
  default: "MIT"
  choices:
    - "MIT"
    - "Apache-2.0"
    - "BSD-3-Clause"
    - "GPL-3.0"
    - "Proprietary"

python_version:
  type: str
  help: "Minimum Python version"
  default: "3.14"
  choices:
    - "3.13"
    - "3.14"

# --- Feature toggles ---

language:
  type: str
  help: "README language(s)"
  default: "EN"
  choices:
    "English": "EN"
    "Portuguese (PT-BR)": "PT-BR"
    "Both": "Both"

enable_github_copilot:
  type: bool
  help: "Enable GitHub Copilot in VS Code settings?"
  default: true

ci_provider:
  type: str
  help: "Which CI provider to set up?"
  default: "none"
  choices:
    "No CI": "none"
    "GitHub Actions": "github"
    "Forgejo Actions": "forgejo"

repo_visibility:
  type: str
  help: "Visibility for the auto-created GitHub repository"
  default: "private"
  choices:
    "Private": "private"
    "Public": "public"
  when: "{{ ci_provider == 'github' }}"

publish_docs:
  type: bool
  help: "Publish the docs to docs.lx.e6a.app on every push to main?"
  default: false
  when: "{{ ci_provider == 'forgejo' }}"

docs_tenant:
  type: str
  help: "Docs tenant: the URL path under docs.lx.e6a.app (lowercase letters, digits and dashes)"
  default: "{{ directory_name }}"
  when: "{{ ci_provider == 'forgejo' and publish_docs }}"
  validator: >-
    {% if not (docs_tenant | regex_search('^[a-z0-9][a-z0-9-]*$')) %}
    The docs tenant must match [a-z0-9][a-z0-9-]*
    {% endif %}

dependency_updates:
  type: str
  help: "Set up automated dependency updates with Renovate?"
  default: "renovate"
  choices:
    "Renovate": "renovate"
    "None": "none"

# Files a project owns once they exist. CLAUDE.md was filled by hand in projects
# generated before AGENTS.md, and docs/index.md is the project's own home page,
# so an update must not merge the template's version into them.
_skip_if_exists:
  - "CLAUDE.md"
  - "docs/index.md"

# --- Conditional file exclusion ---

_exclude:
  - "copier.yml"
  - "tasks/"
  - "__pycache__/"
  - "*.pyc"
  - "{% if ci_provider != 'github' %}.github/workflows/ci.yml{% endif %}"
  - "{% if ci_provider != 'github' or project_type == 'docs' %}.github/workflows/build.yml{% endif %}"
  - "{% if ci_provider != 'github' %}.github/workflows/copier-update.yml{% endif %}"
  - "{% if ci_provider != 'forgejo' %}.forgejo/workflows/ci.yml{% endif %}"
  - "{% if ci_provider != 'forgejo' %}.forgejo/workflows/copier-update.yml{% endif %}"
  - "{% if ci_provider != 'forgejo' or not publish_docs %}.forgejo/workflows/docs.yml{% endif %}"
  - "{% if project_type != 'cli' %}{{ pkg_name }}/cli.py{% endif %}"
  - "{% if project_type == 'docs' %}tests{% endif %}"
  - "{% if project_type == 'docs' %}conftest.py{% endif %}"
  - "{% if project_type == 'docs' %}Dockerfile{% endif %}"
  - "{% if project_type == 'docs' %}.dockerignore{% endif %}"
  - "{% if project_type == 'docs' %}docs/reference.md{% endif %}"
  - "{% if dependency_updates != 'renovate' %}renovate.json{% endif %}"
  - "{% if dependency_updates != 'renovate' or ci_provider != 'github' %}.github/workflows/renovate.yml{% endif %}"
  - "{% if dependency_updates != 'renovate' or ci_provider != 'forgejo' %}.forgejo/workflows/renovate.yml{% endif %}"
